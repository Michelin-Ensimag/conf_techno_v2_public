[project]
name = "client-student"
version = "0.1.0"
description = "Autonomous Kafka player for the Conf Techno V2 logistics game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.0",
    "cryptography>=44.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
